<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikat Kelulusan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a93cb 0%, #a4bfef 100%);
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        
        .sertifikat-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border: 15px solid #d4af37;
            background-color: #fff;
        }
        
        .sertifikat-bg {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.9;
        }
        
        .sertifikat-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 70px 60px;
            text-align: center;
            color: #333;
        }
        
        .penerima {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
        }

        .nama_user::before, .nama_user::after {
            content: "✧";
            margin: 0 15px;
            color: #d4af37;
            font-size: 1.8rem;
        }

        .course-info {
            margin: 50px 0;
            line-height: 1.8;
        }

        .course {
            position: absolute;
            top: 39%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            margin: 20px 0;
        }

        .nama_course {
            font-size: 2rem;
            font-weight: bold;
            color: #8b0000;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 30px 0;
            padding: 10px 20px;
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 5px;
        }
        
        .tanggal_penyelesaian {
            position: absolute;
            top: 57%;
            left: 57%;
            transform: translateX(-50%);
            font-size: 1.3rem;
            color: #2c3e50;
            font-weight: 500;
            width: 100%;
        }
        
        .nama_user {
            font-size: 2.8rem;
            font-weight: bold;
            margin: 20px 0;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            .sertifikat-container {
                border-width: 10px;
            }
            
            .sertifikat-content {
                padding: 40px 20px;
            }

            .nama_user {
                font-size: 2rem;
            }
            
            .nama_course {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sertifikat-container">
            <!-- Background image for the certificate -->
            <img src="../img/design_serti_lulus.png" alt="Background Sertifikat" class="sertifikat-bg">
            
            <!-- Content overlayed on the image -->
            <div class="sertifikat-content">
                <div class="penerima">
                    <div class="nama_user" id="displayNama">{{ NAMA_USER }}</div>
                </div>

                <div class="course">
                    <div class="nama_course" id="displayCourse">{{ NAMA_COURSE }}</div>
                </div>

                <div class="course-info">
                    <div class="tanggal_penyelesaian" id="displayTanggal">{{ tanggal_penyelesaian }}</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
